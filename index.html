 
<script>
"use strict";

const BUSINESS_EMAIL = "covegamerz959@gmail.com";
let gameTimer = null;
let gameState = {};

const $ = id => document.getElementById(id);

function safeRecords() {
  try { return JSON.parse(localStorage.getItem("coveRecords") || "{}"); }
  catch { return {}; }
}

/* INTRO */
const intro = $("intro");
if (intro) {
  if (sessionStorage.getItem("coveIntroSeen")) {
    intro.remove();
  } else {
    sessionStorage.setItem("coveIntroSeen", "yes");
    setTimeout(() => {
      intro.classList.add("hide");
      setTimeout(() => intro.remove(), 750);
    }, 3000);
  }
}

/* NAVIGATION */
$("menuBtn")?.addEventListener("click", () => {
  $("navLinks")?.classList.toggle("show");
});
document.querySelectorAll(".nav-links a").forEach(link => {
  link.addEventListener("click", () => $("navLinks")?.classList.remove("show"));
});
if ($("year")) $("year").textContent = new Date().getFullYear();

/* GAME SEARCH */
function filterGames() {
  const query = ($("gameSearch")?.value || "").toLowerCase();
  const category = $("gameCategory")?.value || "all";
  let visible = 0;

  document.querySelectorAll(".game-card").forEach(card => {
    const match = card.dataset.name.includes(query) &&
      (category === "all" || card.dataset.category === category);
    card.classList.toggle("hidden", !match);
    if (match) visible++;
  });

  $("noGames")?.classList.toggle("hidden", visible > 0);
}
$("gameSearch")?.addEventListener("input", filterGames);
$("gameCategory")?.addEventListener("change", filterGames);

/* PERSONAL SCORES */
function saveRecord(name, score) {
  const records = safeRecords();
  records[name] = Math.max(Number(records[name] || 0), Number(score || 0));
  localStorage.setItem("coveRecords", JSON.stringify(records));
  showRecords();
}

function showRecords() {
  const records = safeRecords();
  const entries = Object.entries(records).sort((a, b) => b[1] - a[1]);
  $("scoresList").innerHTML = entries.length
    ? entries.map(([name, score]) =>
        `<p style="padding:8px;border-bottom:1px solid #29445e">
          🏆 ${name}: <b>${score}</b>
        </p>`).join("")
    : "Play a game to start creating your records!";
}
showRecords();

/* GAME WINDOW */
function stopGame() {
  if (gameTimer) clearInterval(gameTimer);
  gameTimer = null;
}
function closeGame() {
  stopGame();
  $("gameModal").classList.remove("show");
  $("gameContent").innerHTML = "";
}
function launchGame(name) {
  stopGame();
  $("gameModal").classList.add("show");
  const titles = {
    snake:"Neon Snake", tic:"Tic Tac Toe", "2048":"2048 Puzzle",
    memory:"Memory Match", brick:"Brick Breaker",
    runner:"Neon Runner", speed:"Speed Tap", crystal:"Crystal Hunt"
  };
  $("gameTitle").textContent = titles[name] || "Game";
  $("gameContent").innerHTML = "";

  const games = {
    snake:startSnake, tic:startTic, "2048":start2048,
    memory:startMemory, brick:startBrick,
    runner:startRunner, speed:startSpeed, crystal:startCrystal
  };
  if (games[name]) games[name]();
}
$("gameModal")?.addEventListener("click", e => {
  if (e.target.id === "gameModal") closeGame();
});

/* GAME HELPERS */
function message(text) {
  const el = document.createElement("p");
  el.className = "game-message";
  el.textContent = text;
  $("gameContent").appendChild(el);
  return el;
}
function actionButton(text, callback) {
  const b = document.createElement("button");
  b.className = "btn small-btn game-action";
  b.textContent = text;
  b.addEventListener("click", callback);
  $("gameContent").appendChild(b);
  return b;
}

/* TIC TAC TOE */
function startTic() {
  let board = Array(9).fill("");
  let turn = "X";
  let finished = false;

  const status = message("Your turn: X");
  const grid = document.createElement("div");
  grid.className = "game-board";
  grid.style.gridTemplateColumns = "repeat(3,1fr)";
  $("gameContent").appendChild(grid);

  function draw() {
    grid.innerHTML = "";
    board.forEach((value, i) => {
      const b = document.createElement("button");
      b.textContent = value;
      b.addEventListener("click", () => play(i));
      grid.appendChild(b);
    });
  }
  function play(i) {
    if (finished || board[i]) return;
    board[i] = turn;
    const wins = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];
    draw();
    if (wins.some(line => line.every(n => board[n] === turn))) {
      status.textContent = turn + " wins!";
      finished = true;
      if (turn === "X") saveRecord("Tic Tac Toe", 1);
    } else if (board.every(Boolean)) {
      status.textContent = "It's a draw!";
      finished = true;
    } else {
      turn = turn === "X" ? "O" : "X";
      status.textContent = "Your turn: " + turn;
    }
  }
  actionButton("Restart", startTic);
  draw();
}

/* 2048 PUZZLE */
function start2048() {
  let board = Array(16).fill(0);
  let score = 0;
  const status = message("Score: 0");
  const grid = document.createElement("div");
  grid.className = "tile-grid";
  $("gameContent").appendChild(grid);

  function addTile() {
    const empty = board.map((v,i) => v === 0 ? i : -1).filter(i => i >= 0);
    if (empty.length) board[empty[Math.floor(Math.random()*empty.length)]] =
      Math.random() < 0.9 ? 2 : 4;
  }
  function draw() {
    grid.innerHTML = "";
    board.forEach(v => {
      const tile = document.createElement("div");
      tile.className = "tile" + (v ? " filled" : "");
      tile.textContent = v || "";
      grid.appendChild(tile);
    });
    status.textContent = "Score: " + score;
  }
  function move(direction) {
    const old = board.join(",");
    for (let n = 0; n < 4; n++) {
      let indexes = [];
      for (let k = 0; k < 4; k++) {
        if (direction === "left") indexes.push(n*4+k);
        if (direction === "right") indexes.push(n*4+3-k);
        if (direction === "up") indexes.push(k*4+n);
        if (direction === "down") indexes.push((3-k)*4+n);
      }
      let values = indexes.map(i => board[i]).filter(v => v);
      let merged = [];
      for (let i = 0; i < values.length; i++) {
        if (values[i] === values[i+1]) {
          merged.push(values[i]*2);
          score += values[i]*2;
          i++;
        } else merged.push(values[i]);
      }
      while (merged.length < 4) merged.push(0);
      indexes.forEach((idx,i) => board[idx] = merged[i]);
    }
    if (old !== board.join(",")) addTile();
    draw();
    if (board.includes(2048)) status.textContent = "Amazing! You reached 2048!";
    if (old !== board.join(",")) saveRecord("2048 Puzzle", score);
  }
  ["up","left","down","right"].forEach(d =>
    actionButton(d.toUpperCase(), () => move(d)));
  addTile(); addTile(); draw();
}

/* MEMORY MATCH */
function startMemory() {
  const symbols = ["🎮","⭐","🚀","💎","🎯","🔥","👾","🏆"];
  let cards = [...symbols,...symbols].sort(() => Math.random()-.5);
  let first = null, lock = false, matched = 0, moves = 0;
  const status = message("Find all matching pairs!");
  const grid = document.createElement("div");
  grid.className = "memory-grid";
  $("gameContent").appendChild(grid);

  cards.forEach((symbol,i) => {
    const b = document.createElement("button");
    b.className = "memory-card";
    b.textContent = "?";
    b.addEventListener("click", () => {
      if (lock || b.dataset.open || b.dataset.done) return;
      b.textContent = symbol;
      b.dataset.open = "yes";
      if (first === null) {
        first = {b, symbol};
      } else {
        moves++;
        if (first.symbol === symbol) {
          first.b.dataset.done = "yes";
          b.dataset.done = "yes";
          first = null;
          matched += 2;
          status.textContent = "Moves: " + moves;
          if (matched === 16) {
            status.textContent = "You won! Moves: " + moves;
            saveRecord("Memory Match", Math.max(1, 100-moves));
          }
        } else {
          const previous = first.b;
          first = null;
          lock = true;
          setTimeout(() => {
            previous.textContent = "?";
            b.textContent = "?";
            delete previous.dataset.open;
            delete b.dataset.open;
            lock = false;
          }, 700);
          status.textContent = "Moves: " + moves;
        }
      }
    });
    grid.appendChild(b);
  });
  actionButton("Restart", startMemory);
}

/* BRICK BREAKER */
function startBrick() {
  let score = 0;
  const status = message("Tap every block to clear the board!");
  const grid = document.createElement("div");
  grid.className = "game-board";
  grid.style.gridTemplateColumns = "repeat(4,1fr)";
  $("gameContent").appendChild(grid);
  for (let i=0;i<16;i++) {
    const b = document.createElement("button");
    b.textContent = "🧱";
    b.addEventListener("click", () => {
      if (b.disabled) return;
      b.disabled = true;
      b.textContent = "✨";
      score++;
      status.textContent = "Blocks cleared: " + score + "/16";
      if (score === 16) {
        status.textContent = "Level complete!";
        saveRecord("Brick Breaker", score);
      }
    });
    grid.appendChild(b);
  }
  actionButton("Restart", startBrick);
}

/* NEON RUNNER */
function startRunner() {
  let score = 0;
  let playing = true;
  const status = message("Tap JUMP to collect points!");
  const player = document.createElement("div");
  player.style.fontSize = "55px";
  player.textContent = "🏃";
  $("gameContent").appendChild(player);
  actionButton("JUMP", () => {
    if (!playing) return;
    score++;
    status.textContent = "Distance: " + score;
    player.textContent = score % 2 ? "🦘" : "🏃";
  });
  actionButton("Finish Run", () => {
    playing = false;
    status.textContent = "Run finished! Score: " + score;
    saveRecord("Neon Runner", score);
  });
}

/* SPEED TAP */
function startSpeed() {
  let score = 0, time = 10, playing = true;
  const status = message("Tap as fast as you can! Time: 10");
  const tap = actionButton("TAP ⚡", () => {
    if (!playing) return;
    score++;
    status.textContent = "Taps: " + score + " | Time: " + time;
  });
  gameTimer = setInterval(() => {
    time--;
    status.textContent = "Taps: " + score + " | Time: " + time;
    if (time <= 0) {
      stopGame();
      playing = false;
      tap.disabled = true;
      status.textContent = "Time up! Your score: " + score;
      saveRecord("Speed Tap", score);
    }
  }, 1000);
  actionButton("Restart", startSpeed);
}

/* CRYSTAL HUNT */
function startCrystal() {
  let target = Math.floor(Math.random()*9);
  let tries = 5, found = false;
  const status = message("Find the hidden crystal! Attempts: 5");
  const grid = document.createElement("div");
  grid.className = "game-board";
  grid.style.gridTemplateColumns = "repeat(3,1fr)";
  $("gameContent").appendChild(grid);

  for (let i=0;i<9;i++) {
    const b = document.createElement("button");
    b.textContent = "❔";
    b.addEventListener("click", () => {
      if (found || b.disabled) return;
      b.disabled = true;
      if (i === target) {
        b.textContent = "💎";
        found = true;
        status.textContent = "You found the crystal!";
        saveRecord("Crystal Hunt", tries);
      } else {
        b.textContent = "❌";
        tries--;
        status.textContent = "Try again! Attempts: " + tries;
        if (tries === 0) status.textContent = "Game over! Try again.";
      }
    });
    grid.appendChild(b);
  }
  actionButton("Restart", startCrystal);
}

  location.href = "mailto:" + BUSINESS_EMAIL +
    "?subject=" + encodeURIComponent("Cove Gamerz Membership Interest");
}

  e.preventDefault();
  const body =
    "Name: " + $("collabName").value +

$("contactForm")?.addEventListener("submit", e => {
  e.preventDefault();
  const body =
    "Name: " + $("contactName").value +

    "\nMessage: " + $("contactMessage").value;
  location.href = "mailto:" + BUSINESS_EMAIL +
    "?subject=" + encodeURIComponent("Cove Gamerz Contact") +

</script>
